---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: ics-e2e-tester
  name: ics-e2e-tester-deploy
  namespace: e2e-test
spec:
  replicas: 1
  selector:
    matchLabels:
      run: ics-e2e-tester
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        run: ics-e2e-tester
    spec:
      containers:
      - image: alpine:3.21
        imagePullPolicy: IfNotPresent
        name: ics-e2e-tester
        command: ["/bin/sh"]
        args: ["-c", "df -h; while true; do sleep 3; done"]
        volumeMounts:
        - mountPath: /mnt/vol01
          name: vol01
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: vol01
        persistentVolumeClaim:
           claimName: ics-e2e-tester-01
